<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products — FastAPI (Static UI)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1>Product Management</h1>
      <div class="total-pill">Total: <span id="total-count">0</span></div>
    </div>
  </header>

  <div id="alert-container" class="alert-container"></div>

  <nav class="operation-nav">
    <button class="nav-btn active" data-view="fetch">Fetch Products</button>
    <button class="nav-btn" data-view="add">Add Product</button>
    <button class="nav-btn" data-view="update">Update Product</button>
    <button class="nav-btn" data-view="delete">Delete Product</button>
  </nav>

  <main class="main-container">
    <section id="fetch-view" class="view-section active">
      <div class="card">
        <div class="card-header">
          <h2>Fetch Products</h2>
          <input id="search" class="search-input" placeholder="Search by id, name or description...">
        </div>
        <div class="form-actions">
          <button id="fetch-btn" class="btn-primary">Fetch All Products</button>
        </div>
      </div>

      <div class="card products-card">
        <table id="products-table" class="products-table">
          <thead>
            <tr><th>ID</th><th>NAME</th><th>DESCRIPTION</th><th>PRICE</th><th>QUANTITY</th></tr>
          </thead>
          <tbody>
            <tr class="empty-row"><td colspan="5">Click "Fetch All Products" to load data</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="add-view" class="view-section">
      <div class="card">
        <div class="card-header">
          <h2>Add Product</h2>
        </div>
        <form id="add-form" class="form-grid" onsubmit="return false;">
          <div class="form-group">
            <label>Product ID</label>
            <input name="id" type="number" placeholder="Auto-generated if left empty">
          </div>
          <div class="form-group">
            <label>Name <span class="required">*</span></label>
            <input name="name" required placeholder="Product name">
          </div>
          <div class="form-group">
            <label>Description</label>
            <input name="description" placeholder="Product description">
          </div>
          <div class="form-group">
            <label>Price <span class="required">*</span></label>
            <input name="price" type="number" step="0.01" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Quantity <span class="required">*</span></label>
            <input name="quantity" type="number" required placeholder="0">
          </div>
          <div class="form-actions full-width">
            <button class="btn-primary" type="submit">Add Product</button>
            <button class="btn-secondary" type="reset">Clear Form</button>
          </div>
        </form>
      </div>
    </section>

    <section id="update-view" class="view-section">
      <div class="card">
        <div class="card-header">
          <h2>Update Product</h2>
        </div>
        <form id="update-form" class="form-grid" onsubmit="return false;">
          <div class="form-group">
            <label>Product ID <span class="required">*</span></label>
            <input name="id" type="number" required placeholder="Product ID to update">
          </div>
          <div class="form-group">
            <label>Name</label>
            <input name="name" placeholder="Leave blank to keep current">
          </div>
          <div class="form-group">
            <label>Description</label>
            <input name="description" placeholder="Leave blank to keep current">
          </div>
          <div class="form-group">
            <label>Price</label>
            <input name="price" type="number" step="0.01" placeholder="Leave blank to keep current">
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input name="quantity" type="number" placeholder="Leave blank to keep current">
          </div>
          <div class="form-actions full-width">
            <button class="btn-primary" type="submit">Update Product</button>
            <button class="btn-secondary" type="reset">Clear Form</button>
          </div>
        </form>
      </div>
    </section>

    <section id="delete-view" class="view-section">
      <div class="card">
        <div class="card-header">
          <h2>Delete Product</h2>
        </div>
        <form id="delete-form" class="form-grid" onsubmit="return false;">
          <div class="form-group">
            <label>Product ID <span class="required">*</span></label>
            <input name="id" type="number" required placeholder="Product ID to delete">
          </div>
          <div class="form-actions full-width">
            <button class="btn-danger" type="submit">Delete Product</button>
            <button class="btn-secondary" type="reset">Clear Form</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
